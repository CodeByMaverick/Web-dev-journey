<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>My list</h1>
    <h3>Unordered list</h3>
    <ul>
        <li>1
            <ul>
                <li>a1</li>
                <li>a2</li>
            </ul>
        </li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>
    <h3>Ordered list</h3>
    <ol type="1">
        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
    </ol>
    <dl>
        <dt>Berverages</dt>
        <dd>Cold Coffee</dd>
        <dd>Iced Tea</dd>
        <dd>Soft Drinks</dd>
    </dl>
    <h1>Block element</h1>
    <p>Block element</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. <span>inline element</span> Vero, magnam!</p>
</body>
</html>
