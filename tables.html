<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse; 
        }
        th, td{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        tr:nth-child(even){
            background-color: #ada9a9;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Country</th>
            <th>Country Code</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>India</td>
            <td>IN</td>
            <td>india@google.com</td>
        </tr>
        <tr>
            <td>United States of America</td>
            <td>USA</td>
            <td>usa@google.com</td>
        </tr>
        <tr>
            <td>Japan</td>
            <td>JPN</td>
            <td>japan@google.com</td>
        </tr>
        <tr>
            <td>China</td>
            <td>CHN</td>
            <td>china@google.com</td>
        </tr>
    </table>
</body>
</html>
